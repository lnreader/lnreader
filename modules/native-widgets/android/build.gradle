buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    // Glance is Compose-based, so the module needs the Compose compiler that
    // matches the app's Kotlin version (same approach as expo-modules-core).
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.nativewidgets'
version = '0.1.0'

android {
  namespace "expo.modules.nativewidgets"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'proguard-rules.pro'
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':native-background-tasks')
  implementation 'androidx.glance:glance-appwidget:1.1.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
