name: Close Stale Conflicting PRs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log matching pull requests without commenting or closing them'
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - .github/workflows/close-stale-conflicting-prs.yml
      - scripts/close-stale-conflicting-prs.cjs
      - scripts/__tests__/close-stale-conflicting-prs.test.cjs

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test Close Stale Conflicting PRs Script
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout Workflow Script And Tests
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/close-stale-conflicting-prs.cjs
            scripts/__tests__/close-stale-conflicting-prs.test.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Run Unit Tests
        run: node --test scripts/__tests__/close-stale-conflicting-prs.test.cjs

  close-stale-conflicting-prs:
    name: Close Stale Conflicting PRs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Workflow Script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/close-stale-conflicting-prs.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Close Stale Conflicting PRs
        uses: actions/github-script@v8
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        with:
          script: |
            const { run } = require('./scripts/close-stale-conflicting-prs.cjs');

            await run({
              github,
              context,
              core,
              dryRun: process.env.DRY_RUN === 'true',
            });
