name: Close Stale Conflicting PRs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log matching pull requests without commenting or closing them'
        required: false
        default: true
        type: boolean
      base_branch:
        description: 'Base branch to check (defaults to the repository default branch)'
        required: false
        default: ''
        type: string
      stale_months:
        description: 'Months since last code modification before closing a conflicting PR'
        required: false
        default: '6'
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  close-stale-conflicting-prs:
    name: Close Stale Conflicting PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Workflow Script
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/close-stale-conflicting-prs.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Close Stale Conflicting PRs
        uses: actions/github-script@v8
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          STALE_MONTHS: ${{ inputs.stale_months || '6' }}
        with:
          script: |
            const { run } = require('./scripts/close-stale-conflicting-prs.cjs');
            const staleMonths = Number(process.env.STALE_MONTHS || '6');

            await run({
              github,
              context,
              core,
              dryRun: process.env.DRY_RUN === 'true',
              baseBranch: process.env.BASE_BRANCH || '',
              staleMonths,
            });
