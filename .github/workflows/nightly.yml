name: Nightly Android

run-name: Build nightly APKs from master

on:
  workflow_dispatch:

concurrency:
  group: nightly-android
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  NODE_ENV: 'production'

jobs:
  nightly-android:
    name: Build Nightly Release
    if: >-
      github.ref == 'refs/heads/master' &&
      github.actor_id == vars.RELEASE_ACTOR_ID &&
      github.triggering_actor == vars.RELEASE_ACTOR_LOGIN
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set Up pnpm
        uses: pnpm/action-setup@v6

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Resolve Nightly Version
        id: version
        run: |
          echo "Resolving nightly version for $GITHUB_SHA"

          BASE_VERSION="$(node -p "require('./app.json').expo.version")"
          BASE_VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          SHA_SHORT="${GITHUB_SHA:0:8}"

          NIGHTLY_VERSION_CODE="$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))"
          NIGHTLY_VERSION="${BASE_VERSION}-nightly.r${GITHUB_RUN_NUMBER}.${SHA_SHORT}"

          echo "Releasing nightly $NIGHTLY_VERSION (versionCode $NIGHTLY_VERSION_CODE)"
          echo "NIGHTLY_VERSION=$NIGHTLY_VERSION" >> "$GITHUB_ENV"
          echo "NIGHTLY_VERSION_CODE=$NIGHTLY_VERSION_CODE" >> "$GITHUB_ENV"
          echo "version=$NIGHTLY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp Nightly Version
        run: |
          node -e "
            const fs = require('fs');
            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            appJson.expo.version = process.env.NIGHTLY_VERSION;
            appJson.expo.android.versionCode =
              Number(process.env.NIGHTLY_VERSION_CODE);
            fs.writeFileSync(
              'app.json',
              JSON.stringify(appJson, null, 2) + '\n',
            );
          "
          node -p "JSON.stringify({version: require('./app.json').expo.version, versionCode: require('./app.json').expo.android.versionCode})"

      - name: Configure Release Environment
        env:
          MYANIMELIST_CLIENT_ID: ${{ vars.MYANIMELIST_CLIENT_ID }}
          ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
        run: |
          pnpm generate:env:release \
            --build-type "Release" \
            --node-env "production" \
            --myanimelist-client-id "$MYANIMELIST_CLIENT_ID" \
            --anilist-client-id "$ANILIST_CLIENT_ID"

      - name: Generate Native Android Project
        run: |
          pnpm exec expo prebuild \
            --platform android \
            --clean \
            --no-install

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-cleanup: on-success
          add-job-summary: always

      - name: Build Nightly APKs
        working-directory: android
        run: |
          mkdir -p app/build/intermediates/sourcemaps/react/release

          ./gradlew :app:assembleRelease \
            --build-cache \
            --parallel \
            -PreleaseAbiSplits=true \
            --stacktrace

      - name: Package Nightly APKs
        run: pnpm release:package "$NIGHTLY_VERSION"

      - name: Upload Sourcemaps
        run: |
          cp android/app/build/generated/sourcemaps/react/release/index.android.bundle.map \
            "release-artifacts/LNReader-v${NIGHTLY_VERSION}-sourcemap.map"

      - name: Verify APK Signatures
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner |
            sort -V |
            tail -1)"

          if [ -z "$APKSIGNER" ]; then
            echo "Android apksigner was not found"
            exit 1
          fi

          for APK in release-artifacts/*.apk; do
            "$APKSIGNER" verify "$APK"
          done

      - name: Upload Nightly APKs
        uses: actions/upload-artifact@v4
        with:
          name: LNReader-nightly
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish Nightly GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag >/dev/null 2>&1 || true

          gh release create nightly \
            release-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "LNReader Nightly (master @ ${{ env.NIGHTLY_VERSION }})" \
            --notes "Nightly build from the latest master. Includes all APK variants: arm64-v8a (64-bit), armeabi-v7a (32-bit), x86 (32-bit emulators), x86_64 (64-bit emulators) and universal (all devices). This is a rolling pre-release replaced by the next master nightly; the version code always increases so it installs over an existing LNReader build." \
            --prerelease